<!doctype html>
<html lang="es">

    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css" integrity="sha384-oS3vJWv+0UjzBfQzYUhtDYW+Pj2yciDJxpsK1OYPAYjqT085Qq/1cq5FLXAZQ7Ay" crossorigin="anonymous">

        <title>Componentes CSS - Campos de entrada</title>
    </head>

    <body>
        <div class="container">
            <div class="row mt-3">
                <!--
                    Grupos de entradas

                    input-group
                    Se utiliza para agrupar elementos de entrada de formulario (por ejemplo, campos de entrada de texto, botones, selectores, etc.) en un contenedor con un diseño flexible.
                -->
                <div class="input-group">
                    <!--
                        input-group-prepend
                        Se utiliza junto con la clase input-group para agregar un elemento en el lado izquierdo de un campo de entrada en un formulario.

                        Este elemento puede ser cualquier cosa, desde un botón hasta un icono, y se coloca dentro de un elemento span con la clase input-group-text para darle el estilo adecuado.
                    -->
                    <div class="input-group-prepend">
                        <!--
                            input-group-text
                            Se utiliza junto con la clase input-group para agregar un texto o contenido en un campo de entrada en un formulario.
                        -->
                        <span class="input-group-text">
                            <!--Font Awesome Icon-->
                            <i class="fab fa-algolia"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Usuario">
                    </div>
                </div>

                <div class="input-group mt-3">
                    <input type="email" class="form-control" placeholder="Ingresa tú email">
                    <!--
                        input-group-append
                        Se utiliza junto con la clase input-group para agregar contenido al final de un campo de entrada en un formulario.

                        Esta clase se utiliza dentro de un elemento div que se coloca después del elemento input con la clase form-control dentro del elemento div con la clase input-group.
                    -->
                    <div class="input-group-append">
                        <span class="input-group-text">
                            @gmail
                        </span>
                    </div>
                </div>

                <label for="url">url</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            https://gutcas.com/ingresa
                        </span>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <div class="input-group mb-3 mt-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">$</span>
                        <input type="text" class="form-control">
                        <div class="input-group-append">
                            <span class="input-group-text">.00</span>
                        </div>
                    </div>

                    <dvi class="input-group mt-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" placeholder="Ingresa cantidad">
                            <div class="input-group-append">
                                <span class="input-group-text">.00</span>
                            </div>
                        </div>
                    </dvi>

                    <div class="input-group mt-3">
                        <div class="input-group-prepend">
                            <div class="input-group-text">
                                <input type="checkbox">
                            </div>
                            <input type="text" class="form-control">
                        </div>
                    </div>

                    <div class="input-group mt-3">
                        <div class="input-group-prepend">
                            <div class="input-group-text">
                                <input type="radio">
                            </div>
                            <input type="text" class="form-control">
                        </div>
                    </div>

                    <div class="input-group mt-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Nombre y apellidos</span>
                        </div>
                        <input type="text" class="form-control" placeholder="Nombre(s)">
                        <input type="text" class="form-control" placeholder="Apellidos">
                    </div>

                    <div class="input-group mt-3">
                        <input type="text" class="form-control" placeholder="Buscar">
                        <div class="input-group-append">
                            <button class="btn btn-outline-secondary" type="button">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>
    </body>
</html>
