<!doctype html>
<html lang="es">

    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
            integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

        <title>Componentes CSS - Formularios</title>
    </head>

    <body>
        <div class="container">
            <!--CAMPOS TIPO TEXTO-->
            <div class="row mt-5">
                <form>
                    <!--
                        form-group
                        Se utiliza para agrupar elementos de un formulario en una sola unidad visual. La clase se utiliza para envolver etiquetas de formulario y elementos de entrada, como campos de texto, botones y casillas de verificación.
                    -->
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <!--
                            form-control
                            Se utiliza para dar estilo a los elementos de entrada de formularios, como campos de texto, selectores, casillas de verificación y botones de radio. Esta clase se utiliza para establecer un ancho completo para el elemento de entrada y ajustar su apariencia para que se integre con el diseño general de la página.
                        -->
                        <input type="text" class="form-control" placeholder="Ingresa tu nombre">
                    </div>

                    <!--email-->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" placeholder="Ingresa tu email">
                        <!--
                            form-text 
                            Se utiliza para dar estilo al texto de ayuda que se muestra junto a los elementos de formulario. Esta clase se utiliza típicamente con la etiqueta small para proporcionar una descripción breve de cómo se debe llenar el campo de entrada.

                            text-muted
                            Se utiliza para establecer el color de texto gris claro en un elemento. Este estilo se utiliza a menudo para dar un tono de bajo contraste a los textos secundarios, como los textos de ayuda o los textos de los pie de página, para que no distraigan demasiado la atención del contenido principal.
                        -->
                        <small class="form-text text-muted">Este email es valido</small>
                    </div>

                    <!--campo de texto small-->
                    <div class="form-group">
                        <label for="nombre">Nombre small</label>
                        <input type="text" class="form-control form-control-sm" placeholder="Ingresa tu nombre">
                    </div>

                    <!--campo de texto large-->
                    <div class="form-group">
                        <label for="nombre">Nombre small</label>
                        <input type="text" class="form-control form-control-lg" placeholder="Ingresa tu nombre">
                    </div>

                    <!--campo de password-->
                    <div class="form-group">
                        <label for="contrasenia">Contraseña</label>
                        <input type="password" class="form-control" placeholder="Ingresa tu contraseña">
                    </div>

                    <!--campo tipo select-->
                    <div class="form-group">
                        <label for="genero">Genero</label>
                        <select id="genero" class="form-control">
                            <option>Masculino</option>
                            <option>Femenino</option>
                        </select>
                    </div>

                    <!--campo tipo textarea-->
                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" class="form-control" rows="5"></textarea>
                    </div>

                    <!--campo tipo subida archivo-->
                    <div class="form-group">
                        <label for="archivo">Subir Archivo</label>
                        <input type="file" id="archivo" class="form-control-file">
                        <small class="form-text text-muted">Máximo 2mb</small>
                    </div>

                    <!--
                        campo tipo subida archivo personalizado

                        custom-file
                        Se utiliza para personalizar la apariencia y el comportamiento de los elementos de entrada de archivos en un formulario HTML. Esta clase se aplica a un elemento div que envuelve el elemento de entrada de archivos (<input type="file">), y permite personalizar el aspecto del botón de selección de archivos, la etiqueta de archivo seleccionada y otros estilos relacionados.
                    -->
                    <div class="custom-file">
                        <!--
                            custom-file-input
                            Se utiliza en combinación con la clase custom-file para personalizar la apariencia y el comportamiento de los elementos de entrada de archivos en un formulario HTML.
                        -->
                        <input type="file" id="archivo" class="custom-file-input">

                        <!--
                            custom-file-label
                            Se utiliza en combinación con la clase custom-file-input para personalizar la etiqueta que se muestra junto al botón de selección de archivos en un formulario HTML.
                        -->
                        <label class="custom-file-label" for="archivo">Subir Archivo</label>
                    </div>

                    <br><br>
                    
                    <!--campo tipo rango-->
                    <div class="form-group">
                        <label for="membresia">Membresia Oro</label>
                        <!--
                            custom-range
                            Se utiliza para personalizar la apariencia de un elemento input de tipo range. Este tipo de elementos se utilizan para permitir al usuario seleccionar un valor dentro de un rango especificado.
                        -->
                        <input type="range" class="custom-range" min="2" max="10" value="3">
                    </div>

                    <!--boton-->
                    <br>
                    <button class="btn btn-primary btn-block" type="submit">Enviar</button>
                    <br /><br />
                </form>

                <!--Formulario en línea-->
                <form class="form-inline">
                    <input type="text" class="form-control mr-2" placeholder="Ingresa usuario">
                    <input type="password" class="form-control mr-2" placeholder="Ingresa contraseña">
                    <div class="form-check">
                        <!--
                            form-check-label
                            Se utiliza en combinación con la clase form-check-input para crear etiquetas de elementos de formulario personalizadas para los botones de radio (<input type="radio">) y casillas de verificación (<input type="checkbox">).
                        -->
                        <label class="form-check-label mr-2">
                            <!--
                                form-check-input
                                Se utiliza en combinación con la clase form-check-label para crear botones de radio (<input type="radio">) y casillas de verificación (<input type="checkbox">) personalizadas en los formularios.
                            -->
                            <input type="checkbox" class="form-check-input">Recordar contraseña
                        </label>
                    </div>
                    <button class="btn btn-success" type="submit">Ingresar</button>
                </form>
            </div>
        </div>

        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>
    </body>
</html>
