<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css" integrity="sha384-oS3vJWv+0UjzBfQzYUhtDYW+Pj2yciDJxpsK1OYPAYjqT085Qq/1cq5FLXAZQ7Ay" crossorigin="anonymous">

    <title>Componentes CSS - Alertas</title>
  </head>

  <body>
    <div class="container mt-5">
      <!--Insignias-->
      <ul class="list-group mb-5">
        <li class="list-group-item">Mi lista</li>
        <!--
          d-flex
          Se utiliza para crear un contenedor de elementos que se comporta como un contenedor flexible. Esta clase se utiliza en combinación con otras clases de diseño para alinear y distribuir elementos de manera flexible.

          Al utilizar la clase d-flex en un contenedor, los elementos secundarios de ese contenedor se convierten en elementos flexibles que pueden ajustarse para llenar el espacio disponible en el contenedor. Esto significa que se pueden crear diseños flexibles y receptivos sin tener que recurrir a técnicas complicadas de posicionamiento.

          La clase d-flex también puede utilizarse junto con otras clases de flexbox, como justify-content, align-items y flex-wrap, para controlar el comportamiento del contenedor flexible y sus elementos secundarios.

          justify-content-between
          Se utiliza para alinear los elementos en una fila horizontal y distribuir el espacio restante entre ellos de manera uniforme, dejando un espacio igual entre los elementos contiguos.

          align-items-center
          Se utiliza para centrar verticalmente los elementos dentro de su contenedor padre.
        -->
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Mi segunda lista
          <!--
            badge
            se utiliza para crear etiquetas de notificación o contadores que se pueden agregar a cualquier elemento HTML. La clase agrega un estilo de borde y un fondo de color para crear un diseño de etiqueta atractivo.

            Puede usar la clase badge junto con otras clases de Bootstrap, como badge-primary, badge-secondary, badge-success, badge-danger, badge-warning, badge-info y badge-light, para agregar diferentes colores a la etiqueta.
          -->
          <span class="badge badge-warning">50</span>
        </li>
        <li class="list-group-item">Lista 3</li>
        <li class="list-group-item">Lista 4</li>
        <li class="list-group-item">Lista 5</li>
      </ul>

      <!-- Breadcumbs-->
      <ol class="breadcrumb">
        <li class="breadcrumb-item active">Inicio</li>
      </ol>

      <ol class="breadcrumb">
        <li class="breadcrumb-item">Inicio</li>
        <li class="breadcrumb-item active">Empresa</li>
      </ol>

      <ol class="breadcrumb">
        <li class="breadcrumb-item">Inicio</li>
        <li class="breadcrumb-item">Empresa</li>
        <li class="breadcrumb-item active">Historia</li>
      </ol>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
